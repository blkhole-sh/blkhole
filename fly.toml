# fly.toml - blkhole deployment configuration
# Deploy with: fly launch / fly deploy
# Set secrets before deploying: fly secrets set BLKHOLE_SECRET=<32-byte-hex>

app = "blkhole"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  BLKHOLE_DOMAIN = "blkhole.fly.dev"

# ACME HTTP Challenge server (port 80) - for Let's Encrypt
[[services]]
  protocol = "tcp"
  internal_port = 80

  [[services.ports]]
    port = 80
    handlers = ["http"]

# Main HTTP/HTTPS web interface + DoH
[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

# DNS-over-TLS (port 853, TCP)
[[services]]
  protocol = "tcp"
  internal_port = 853

  [[services.ports]]
    port = 853

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for SQLite database and TLS certs
[[mounts]]
  source = "blkhole_data"
  destination = "/root/.config/blkhole"
  initial_size = "1gb"
