# fly.toml - blkhole deployment configuration
# Deploy with: fly launch / fly deploy
# Set secrets before deploying: fly secrets set BLKHOLE_SECRET=<32-byte-hex>

app = "blkhole"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BLKHOLE_PORT = "8080"
  BLKHOLE_UPSTREAM_DNS = "1.1.1.1:53"
  # BLKHOLE_DOMAIN = "your-app.fly.dev"  # set this if using autocert instead of -p

# HTTP/HTTPS web interface + DoH
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

# DNS-over-TLS (port 853, TCP)
[[services]]
  protocol = "tcp"
  internal_port = 853

  [[services.ports]]
    port = 853

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for SQLite database and TLS certs
[[mounts]]
  source = "blkhole_data"
  destination = "/root/.config/blkhole"
  initial_size = "1gb"
