services:
  server:
    build: ./backend
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./backend/db:/app/db

  app:
    build: ./frontend
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env
    depends_on:
      - server

